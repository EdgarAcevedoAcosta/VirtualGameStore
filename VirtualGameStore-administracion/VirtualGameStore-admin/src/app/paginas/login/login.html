<div class="login">
  <div class="tarjeta">
    <div class="login__marca">
      <img src="/favicon.ico" alt="" />
      <div>
        <h1 style="margin: 0">Panel del Virtual Game Store</h1>
        <span class="dato__clave">Sólo para Administradores</span>
      </div>
    </div>

    @if (vencio) {
      <div class="aviso aviso--atencion">Tu sesión venció. Vuelve a entrar.</div>
    }
    @if (problema(); as p) {
      <div class="aviso aviso--error">{{ p }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="enviar()">
      <div class="campo">
        <label for="correo">Correo</label>
        <input id="correo" type="email" formControlName="correo" autocomplete="username" />
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>
      <button class="boton" type="submit" [disabled]="enviando()">
        {{ enviando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
