<header class="barra">
  <div class="barra__interior">
    <a class="barra__marca" routerLink="/productos">
      <img src="/favicon.ico" alt="" /> Virtual Game Store
      <span class="barra__etiqueta">Admin</span>
    </a>
    <nav class="barra__enlaces">
      <a class="barra__enlace" routerLink="/productos" routerLinkActive="barra__enlace--activo"
        >Productos</a
      >
      <a class="barra__enlace" routerLink="/categorias" routerLinkActive="barra__enlace--activo"
        >Categorias</a
      >
      <a class="barra__enlace" routerLink="/usuarios" routerLinkActive="barra__enlace--activo"
        >Usuarios</a
      >
      <a class="barra__enlace" routerLink="/direcciones" routerLinkActive="barra__enlace--activo"
        >Direcciones</a
      >
      <a class="barra__enlace" routerLink="/compras" routerLinkActive="barra__enlace--activo"
        >Compras</a
      >

      <span class="barra__quien"> • {{ sesion.usuario()?.nombre }} </span>
      <button class="boton boton--chico boton--secundario cerrar" (click)="salir()">
        Cerrar Sesión
      </button>
    </nav>
  </div>
</header>

<main class="pagina">
  <router-outlet />
</main>
