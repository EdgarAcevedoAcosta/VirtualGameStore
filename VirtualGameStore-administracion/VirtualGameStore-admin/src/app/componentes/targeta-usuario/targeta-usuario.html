<article
  class="tarjeta-usuario"
  [class.tarjeta-usuario--activa]="activa()"
  (click)="seleccionar.emit(usuario())"
>
  <div class="tarjeta-usuario__cuerpo">
    <h3 class="tarjeta-usuario__nombre">{{ usuario().nombre }}</h3>
    <p class="tarjeta-usuario__correo">{{ usuario().correo }}</p>
    <p class="tarjeta-usuario__desc">{{ usuario().rol }}</p>
    <p class="tarjeta-usuario__desc">
      @switch (usuario().activo) {
        @case ('activo') {
          Usuario Activo
        }
        @case ('inactivo') {
          Usuario Inactivo
        }
      }
    </p>
    <div class="terjeta-usuario__pie">
      <span [class]="'etiquetaetiqueta--' + usuario().creadoEn">{{ usuario().creadoEn }}</span>
    </div>

    <div class="acciones">
      <a [routerLink]="['/usuarios', usuario().idUsuario, 'editar']" class="boton editar"
        >Editar Usuario</a
      >
      <button
        class="boton-eliminar"
        type="button"
        [disabled]="eliminando()"
        (click)="$event.stopPropagation(); eliminar(usuario().idUsuario)"
      >
        <img src="/trash.ico" alt="Eliminar" class="icon-delete-grande" />
      </button>
      @if (errorEliminar(); as error) {
        <p class="error" role="alert">{{ error }}</p>
      }
    </div>
  </div>
</article>
