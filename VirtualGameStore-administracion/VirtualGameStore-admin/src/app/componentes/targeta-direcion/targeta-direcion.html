<article
  class="tarjeta-clase"
  [class.tarjeta-clase--activa]="activa()"
  (click)="seleccionar.emit(direccion())"
>
  <div class="tarjeta-clase__cuerpo">
    <h3 class="tarjeta-clase__nombre">{{ direccion().idUsuario }}</h3>
    <p class="tarjeta-clase__desc">{{ direccion().pais }}</p>
    <p class="tarjeta-clase__desc">{{ direccion().ciudad }}</p>
    <p class="tarjeta-clase__desc">{{ direccion().calle }}</p>
    <p class="tarjeta-clase__desc">{{ direccion().codigoPostal }}</p>
  </div>
  <div class="acciones">
    <a [routerLink]="['/direcciones', direccion().idDireccion, 'editar']" class="boton-editar"
      >Editar Direccion</a
    >
    <!--
    <button class="boton-eliminar" (click)="eliminar(direccion().idDireccion)">
      <img src="/public/delete.png" alt="Eliminar" class="icon-delete" />
    </button>-->
  </div>
</article>
