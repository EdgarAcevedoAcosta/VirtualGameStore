<article
  class="tarjeta-categoria"
  [class.tarjeta-categoria--activa]="activa()"
  (click)="seleccionar.emit(categoria())"
>
  <div class="tarjeta-categoria__cuerpo">
    <h3 class="tarjeta-categoria__nombre">{{ categoria().nombre }}</h3>
    <div class="acciones">
      <a [routerLink]="['/categorias', categoria().idCategoria, 'editar']" class="boton editar"
        ><img src="/edit.ico" alt="Editar" class="icon-delete" /> Editar Categoria</a
      >
      <!---->
      <button class="boton-eliminar" (click)="eliminar(categoria().idCategoria)">
        <img src="/trash.ico" alt="Eliminar" class="icon-delete" />
      </button>
    </div>
  </div>
</article>
